<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stream Controller</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script type="module" src="/static/js/control.js" defer></script>
</head>
<body>
    <h1>VTuber Bot Control</h1>

    <h3>Bot Lifecycle</h3>
    <button id="init-btn" class="lifecycle-btn" onclick="doInitialize()">Initialize / Setup</button>
    <button id="start-btn" class="lifecycle-btn" onclick="doStartProcessing()">Start Processing</button>
    <button id="pause-btn" class="lifecycle-btn" onclick="doPause()">Pause</button>
    <button id="resume-btn" class="lifecycle-btn" onclick="doResume()">Resume</button>
    <button id="stop-btn" onclick="sendCommand('terminate')">Full Stop</button>

    <h2>Feature Toggles</h2>
    <div id="toggles"></div>

    <h2>Audio Files (Sing)</h2>
    <div id="audio-list"></div>

    <h2>PNG Avatar Models</h2>

    <h3>Load Model</h3>
    <div class="lifecycle-group">
        <button onclick="refreshPngModels()">Refresh Models</button>
        <select id="png-model-select" style="padding: 8px; width: 220px;">
            <option value="">-- Select Model --</option>
        </select>
        <button onclick="loadSelectedModel()">Load Model</button>
        <button onclick="setPngMode('idle')">Force Idle</button>
        <button onclick="setPngMode('speak')">Force Speak</button>
    </div>
    <div id="png-status" style="font-size: 0.9em; margin-top: 4px; min-height: 1.2em;"></div>

    <h3>Upload New Model</h3>
    <div class="lifecycle-group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <label>
            Model name:
            <input id="upload-model-name" type="text" placeholder="e.g. qubit_default" style="padding: 6px; width: 200px; margin-left: 8px;">
        </label>
        <label>
            Blink + Idle:
            <input id="upload-blink-idle" type="file" accept="image/png" style="margin-left: 8px;">
        </label>
        <label>
            Blink + Speaking:
            <input id="upload-blink-speaking" type="file" accept="image/png" style="margin-left: 8px;">
        </label>
        <label>
            Eyes Open + Idle:
            <input id="upload-open-idle" type="file" accept="image/png" style="margin-left: 8px;">
        </label>
        <label>
            Eyes Open + Speaking:
            <input id="upload-open-speaking" type="file" accept="image/png" style="margin-left: 8px;">
        </label>
        <button onclick="uploadModel()">Upload Model</button>
    </div>

    <h2>View Output</h2>
    <button onclick="launchOverlayWindow()" style="background-color: var(--primary);">Launch Overlay Window</button>

    <div id="status"></div>
    <button id="retry-btn" onclick="forceReconnect()" style="display:none;">Retry now</button>
    <div id="cmd-status"></div>
</body>
</html>
